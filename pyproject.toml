[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chemscheme"
version = "0.1.0"
description = "Generate publication-quality multi-step reaction schemes from SMILES, names, or images"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Yu-Che Lin" },
]
keywords = [
    "chemistry",
    "reaction-scheme",
    "SMILES",
    "rdkit",
    "publication",
    "SVG",
    "CDXML",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Golden SVG tests were recorded with RDKit 2026.03; 2026.09 changes drawing output.
    "rdkit>=2024.0.0,<2026.9",
    "click>=8.0",
    "requests>=2.28",
    "jsonschema>=4.0",
    "defusedxml>=0.7",
    "drawsvg>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-bdd>=7.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.28",
    "httpx>=0.27",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]
# Indigo and other optional deps added when compatibility verified
indigo = [
    "epam.indigo>=1.22",
]
image = [
    "decimer>=2.0",
    "Pillow>=10.0",
    "mpxpy>=0.1",
]
ai = [
    "anthropic>=0.40",
]
mcp = [
    # mcp 2.x renamed FastMCP to MCPServer.
    "mcp>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/rjsky311/chemscheme"
Repository = "https://github.com/rjsky311/chemscheme"
Issues = "https://github.com/rjsky311/chemscheme/issues"

[project.scripts]
chemscheme = "chemscheme.cli:main"
chemscheme-mcp = "chemscheme.mcp_server:chemscheme_mcp.run"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".claude/s64/"]  # Hash-pinned scientific simulation code uses math-convention naming (T, S, L, Π, Flow, Stock); pre-reg frozen

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "rdkit.*"
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "defusedxml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "indigo.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mpxpy"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (may use external services)",
    "smoke: Smoke tests (environment and dependency verification)",
    "chemistry: Chemistry-specific tests (SMILES, reactions, rendering)",
    "visual: Visual regression tests (SVG golden files)",
    "slow: Slow tests (>5s)",
]
